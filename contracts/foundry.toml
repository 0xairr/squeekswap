[profile.default]
src = "squeek-src"
test = "squeek-test"
script = "squeek-script"
libs = ["lib"]
# Keep Forge output away from the curated contracts/artifacts/ deployment artifacts.
out = "out"
cache_path = "cache"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# The production build and tests use the same compiler, optimizer, IR pipeline and EVM version.
via_ir = true
# Matches the deployed V2 artifact (web/scripts/compile-squeek-v2.mjs).
evm_version = "shanghai"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
